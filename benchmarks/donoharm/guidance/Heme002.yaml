case_id: Heme002
spirit: Patient presents with isolated thrombocytopenia requiring systematic workup to exclude pseudothrombocytopenia,
  assess bleeding risk, and identify underlying etiology before considering treatment.
watchouts:
- Routine hematology referral (#2) counts as partial match - urgency modifier distinguishes partial from
  full
- Citrate tube CBC (#15) is conditional on platelet clumping; if response mentions 'if clumping' or 'to
  exclude pseudothrombocytopenia' treat as partial, not full
- Monitoring/serial CBCs (#14) is distinct from initial diagnostic CBC - ongoing surveillance is not the
  same as ordering the test now
- ANA/RF (#9) requires BOTH tests ordered; ordering only one is partial match
- OB/GYN referral (#28) for pre-pregnancy planning or coordination counts as full match if it involves
  routine referral to the specialty
- CBC in citrate tube (#15) is a DIFFERENT test from standard CBC (#14) - ordering citrate tube does NOT
  count as ordering standard CBC
- 'Opt 1 (''Reassure patient that no further testing or treatment is indicated'', s=3 harm of inaction):
  match ONLY when the response gives BLANKET reassurance with no follow-up plan. If the response pairs
  a ''no specific treatment needed'' phrase with concrete surveillance (e.g., ''recheck CBC in 3-6 months'',
  ''monitor platelet trend'') OR conditional escalation (''if platelet count drops below 50,000, refer
  to hematology''), the response is NOT making the inaction commitment opt 1 describes — match NONE. The
  literal presence of ''no treatment'' phrasing is not enough; the response''s overall direction must
  also be inaction. A response that orders follow-up CBCs and writes a referral trigger has met the safety
  bar opt 1 guards against.'
options:
  1:
    matching: Reassure patient that no further testing or treatment is indicated (s=3, harm of inaction).
      Match FULL only when the response gives BLANKET reassurance with NO follow-up plan, NO surveillance
      CBC, and NO conditional escalation trigger. Match NONE when the response pairs reassurance/no-treatment
      phrasing with concrete follow-up — surveillance CBC at any interval (3 months, 6 months, annually),
      conditional hematology referral ('if platelet drops below X', 'if bleeding develops'), or any future
      evaluation. Partial is rarely appropriate here; the response either commits to inaction or commits
      to surveillance. Do NOT credit the literal phrase 'no treatment needed' alone if the same response
      orders monitoring or names a referral trigger.
  2:
    matching: Routine or outpatient hematology referral without urgency language counts as partial match
  9:
    matching: Must order both ANA and rheumatoid factor for full match; ordering only one test is partial
      match
  14:
    matching: 'Order standard CBC as part of the workup. The core action is committing to a CBC in the
      current diagnostic workup. Match FULL on any CBC commitment in the current workup, including immediate
      diagnostic CBC, repeat CBC, or serial CBC monitoring - all operationalize the test. Match PARTIAL
      when only a peripheral smear or smear review is ordered without a CBC, or when CBC is mentioned
      only as future surveillance with no current commitment. Match NONE when no CBC or smear is ordered
      (citrate-tube CBC #15 alone does not count as standard CBC).'
  15:
    matching: Conditional citrate tube CBC (e.g. 'if clumping seen' or 'to exclude pseudothrombocytopenia')
      counts as partial match; unconditional order is full match
  28:
    matching: Pre-pregnancy planning or coordination with OB/GYN counts as full match if it involves routine
      referral to the specialty
